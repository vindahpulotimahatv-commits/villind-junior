<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Overlay skor vMix</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
#bar{position:fixed;left:40px;bottom:40px;display:none;align-items:stretch;height:112px;color:#fff;font-weight:800;text-transform:uppercase;box-shadow:0 4px 18px rgba(0,0,0,.45);border-radius:10px;overflow:hidden}
#bar.on{display:flex}
#goal-line{position:fixed;left:40px;bottom:160px;display:none;align-items:center;gap:12px;padding:12px 20px;background:rgba(16,25,35,.94);border-left:7px solid #F6B83F;border-radius:7px;color:#fff;font-size:27px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;box-shadow:0 4px 18px #0008}
#goal-line.on{display:flex}
#goal-line small{color:#F6B83F;font-size:18px}
.cat{background:#F6B83F;color:#101923;padding:0 18px;display:flex;align-items:center;font-size:34px}
.tm{background:#123D38;padding:0 26px;display:flex;align-items:center;font-size:40px;min-width:230px;justify-content:center;white-space:nowrap}
.sc{background:#101923;color:#F6B83F;padding:0 22px;display:flex;align-items:center;font-size:56px;min-width:60px;justify-content:center}
.ck{background:#174C46;padding:0 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:36px;line-height:1;min-width:110px}
.tm{gap:12px}.tlogo.ov{height:100px;width:auto}
.ck small{font-size:18px;color:#F6B83F;margin-top:4px}
.cds{display:flex;gap:7px;align-items:center}
.cd{width:28px;height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;line-height:1;box-shadow:0 2px 8px #000a}
.cd.y{background:#f7c92c;color:#2a2100}.cd.r{background:#e0232a;color:#fff}
.cd.pop{animation:cdpop .9s ease}
@keyframes cdpop{0%{transform:scale(.2) rotate(-14deg);opacity:0}55%{transform:scale(1.55) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
</style></head><body>
<div id="bar"><div class="cat" id="c"></div><div class="tm" id="a"></div><div class="sc" id="sa"></div><div class="sc" id="sb">0</div><div class="tm" id="b"></div><div class="ck"><span id="t">00:00</span><small id="s"></small></div></div>
<div id="goal-line"><small>GOAL</small><span id="goal-player"></span><small id="goal-minute"></small></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script>
// Tambahkan ?kategori=U11 atau ?kategori=U15 untuk memilih kategori.
// Gunakan ?match=UUID untuk mengunci overlay ke satu pertandingan tertentu.
// Tambahkan ?demo=1 untuk uji tampilan dengan data contoh (tanpa pertandingan live).
var V = window.VJT, qs = new URLSearchParams(location.search), cat = qs.get('kategori'), matchIdParam = qs.get('match'), demo = qs.get('demo') === '1', cur = null, cards = { A: { y: 0, r: 0 }, B: { y: 0, r: 0 } }, prevKey = null, prevCards = {};
var $ = function (i) { return document.getElementById(i); };
function cdHtml(team, type, n) {
  if (!n) return '';
  var k = team + type, changed = prevCards[k] !== undefined && prevCards[k] !== n;
  return '<span class="cd ' + type + (changed ? ' pop' : '') + '">' + (n > 1 ? n : '') + '</span>';
}
function cdBox(team) {
  var c = cards[team], h = cdHtml(team, 'y', c.y) + cdHtml(team, 'r', c.r);
  prevCards[team + 'y'] = c.y; prevCards[team + 'r'] = c.r;
  return h ? '<span class="cds">' + h + '</span>' : '';
}
function load() {
  if (demo) {
    cur = { id: 'demo', category: 'U11', team_a: 'RT 005/021', team_b: 'RT 009/021', score_a: 2, score_b: 1, status: 'LIVE', period: 2, clock_base: 600, clock_started_at: new Date().toISOString() };
    cards = { A: { y: 1, r: 0 }, B: { y: 2, r: 1 } }; return draw();
  }
  if (!V.sb) return;
  V.sb.from('matches').select('*').in("status", ["LIVE", "HALF TIME"]).order('kickoff').then(function (r) {
    var d = (r.data || []).filter(function (m) { return (!cat || m.category === cat) && (!matchIdParam || m.id === matchIdParam); });
    cur = d[0] || null;
    if (!cur) { cards = { A: { y: 0, r: 0 }, B: { y: 0, r: 0 } }; return draw(); }
    var id = cur.id;
    V.sb.from('match_events').select('type,team,note,player,minute,created_at').eq('match_id', id).in('type', ['card','goal']).order('created_at', { ascending: false }).then(function (er) {
      if (!cur || cur.id !== id) return;
      var c = { A: { y: 0, r: 0 }, B: { y: 0, r: 0 } }, goals = [];
      (er.data || []).forEach(function (e) {
        if (e.type === 'card') {
          var t = c[e.team]; if (!t) return;
          if (/merah/i.test(e.note || '')) t.r++; else t.y++;
        } else if (e.type === 'goal') goals.push(e);
      });
      cards = c;
      var latest = goals[0], line = $('goal-line');
      if (latest) {
        var teamName = latest.team === 'A' ? cur.team_a : cur.team_b;
        $('goal-player').textContent = (latest.player || teamName) + ' · ' + teamName;
        $('goal-minute').textContent = latest.minute != null ? latest.minute + "'" : '';
        line.classList.add('on');
      } else line.classList.remove('on');
      draw();
    });
  });
}
function draw() {
  $('bar').classList.toggle('on', !!cur);
  if (!cur) { prevKey = null; prevCards = {}; $('goal-line').classList.remove('on'); return; }
  if (prevKey !== cur.id) { prevKey = cur.id; prevCards = {}; }
  $('c').textContent = V.CATEGORY_LABEL[cur.category] || cur.category;
  $('a').innerHTML = V.logoImg(cur.team_a, 'ov') + '<span>' + V.esc(cur.team_a) + '</span>' + cdBox('A');
  $('b').innerHTML = cdBox('B') + '<span>' + V.esc(cur.team_b) + '</span>' + V.logoImg(cur.team_b, 'ov');
  $('sa').textContent = cur.score_a; $('sb').textContent = cur.score_b;
  $('s').textContent = cur.status === 'HALF TIME' ? 'HALF TIME' : 'BABAK ' + cur.period;
  $('t').textContent = V.fmtClock(V.elapsed(cur, Date.now()));
}
setInterval(function () { if (cur) $('t').textContent = V.fmtClock(V.elapsed(cur, Date.now())); }, 1000);
V.loadTeamLogos().then(function () {
  load(); if (!demo) setInterval(load, 5000);
  if (V.sb && !demo) V.sb.channel('vjt-overlay').on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, load)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'match_events' }, load).subscribe();
});
</script></body></html>
